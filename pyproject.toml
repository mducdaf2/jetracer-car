[project]
name = "jetracer-car"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gym-donkeycar",
    "gymnasium>=1.3.0",
    "matplotlib>=3.10.9",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "onnx>=1.22.0",
    "onnxruntime<1.21.0",
    "opencv-python>=5.0.0.93",
    "traitlets>=5.16.1",
]

[project.scripts]
jetracer-car = "jetracer_car:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["simulation"]

[tool.uv.sources]
gym-donkeycar = { git = "https://github.com/tawnkramer/gym-donkeycar" }
